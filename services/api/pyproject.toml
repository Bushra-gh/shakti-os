[project]
name = "shaktios-api"
version = "0.1.0"
description = "Minimal FastAPI service for ShaktiOS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "cryptography>=42.0,<46.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "cryptography>=42.0,<46.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
